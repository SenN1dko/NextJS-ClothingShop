name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Отдельную базу shop_test создаёт сама фикстура в conftest.py:
      # CREATE DATABASE нельзя выполнить внутри транзакции, поэтому
      # раньше это требовало хрупкого шага с docker run + psql.

      - name: Check schema drift
        # alembic.ini лежит в корне backend/, а схема в src/.
        # `check` падает, если модели разошлись с миграциями.
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Format check
        run: uv run --no-sync ruff format --check src tests

      - name: Test
        run: uv run --no-sync pytest --cov=src --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
