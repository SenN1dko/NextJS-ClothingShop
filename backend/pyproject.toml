[project]
name = "dressly-backend"
version = "1.0.0"
description = "API интернет-магазина одежды Dressly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.3.0",
    "fastapi>=0.119.1",
    "pyjwt>=2.10.1",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38.0",
    "yarl>=1.22.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: модули из src/ попадают в корень пакета,
# поэтому `import core` работает из любого каталога.
packages = ["src"]
sources = ["src"]
# Каталог src/alembic нельзя поставлять как пакет `alembic`:
# он перекрыл бы одноимённую библиотеку.
exclude = ["src/alembic"]

[tool.uv]
# Проект устанавливается в редактируемом режиме, чтобы
# alembic и скрипты видели пакеты из src/.
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Engine создаётся один раз, поэтому и event loop должен быть
# общим для всех тестов, иначе соединения пересекают циклы.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Приложение живёт в src/ и не устанавливается как пакет,
# поэтому добавляем src в sys.path.
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "Q", "UP", "C4", "SIM", "RUF"]
ignore = [
    # Локальные имена переменных циклов не нужны в этом проекте.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Миграции генерируются Alembic.
"src/alembic/versions/*" = ["E501", "I001", "N802"]
# Тесты: длинные строки, assert, тестовые учётные данные и числа.
"tests/*" = ["E501", "S101", "S105", "S106", "S107", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = ["**/__pycache__", "src/alembic"]

reportMissingImports = "error"
reportMissingTypeStubs = false
